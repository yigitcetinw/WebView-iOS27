name: iOS Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15 # macOS 14 yerine güncel runner

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Build App
      run: |
        xcodebuild build \
          -project WebView-iOS27.xcodeproj \
          -scheme WebView-iOS27 \
          -sdk iphoneos \
          -configuration Release \
          -derivedDataPath ./build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO

    - name: Package App (.ipa)
      run: |
        mkdir Payload
        mv ./build/Build/Products/Release-iphoneos/WebView-iOS27.app Payload/
        zip -r WebView-iOS27.ipa Payload

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WebView-iOS27-Build
        path: WebView-iOS27.ipa
